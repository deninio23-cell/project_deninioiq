name: Playwright Regression Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  regression-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Set up Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies & Pip Requirements
      run: |
        python -m pip install --upgrade pip
        pip install pytest playwright pyee

    - name: Initialize Playwright Browser Binaries
      run: playwright install chromium --with-deps

    - name: Execute Automated Regression Test Suite
      run: python -m pytest -s -v tests/regression_test.py
      env:
        CI: "true"

    - name: Archive Visual Test Evidence Screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: regression-failure-traces
        path: screenshots/
        if-no-files-found: ignore
        retention-days: 7